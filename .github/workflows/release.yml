name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ""

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libfuse2 build-essential

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp build/usbunker AppDir/usr/bin/

      - name: Download linuxdeploy tools
        run: |
          curl -L -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          EXTRA_QT_MODULES: "svg"
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/usbunker \
            --desktop-file resources/linux/usbunker.desktop \
            --icon-file resources/icons/shield.svg \
            --icon-filename usbunker \
            --plugin qt \
            --output appimage

          mv USBunker*.AppImage USBunker-linux-x86_64.AppImage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: USBunker-linux-x86_64.AppImage
          generate_release_notes: true

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ""

      - name: Install OpenSSL
        run: choco install openssl --no-progress -y

      - name: Configure
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build
        run: cmake --build build --config Release -j4

      - name: Bundle Qt dependencies
        run: |
          mkdir dist
          copy build\Release\usbunker.exe dist\
          windeployqt --release dist\usbunker.exe

      - name: Copy OpenSSL DLLs
        run: |
          $ssl = (Get-Command openssl.exe).Source | Split-Path
          copy "$ssl\libssl-*.dll" dist\ -ErrorAction SilentlyContinue
          copy "$ssl\libcrypto-*.dll" dist\ -ErrorAction SilentlyContinue

      - name: Zip release
        run: Compress-Archive -Path dist\* -DestinationPath USBunker-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: USBunker-windows-x64.zip
          generate_release_notes: true
